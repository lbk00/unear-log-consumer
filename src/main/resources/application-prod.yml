spring:
  forward-headers-strategy: framework

  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false


  data:
    redis:
      url: rediss://${REDIS_HOST}:${REDIS_PORT}

logging:
  level:
    root: INFO
    com.unear: INFO

internal:
  key: ${INTERNAL_KEY}